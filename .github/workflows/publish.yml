name: Refresh published site

# The DATA changed, not the site. Somebody edited a committee or a roster in the
# platform; nothing in this repository changed at all, but the built HTML is now
# stale. That is the price of static generation and the whole reason a schedule
# exists.
#
# **It rebuilds the LATEST RELEASED TAG, never main.** That single choice is
# what lets work land on main freely without reaching the public site: a refresh
# ships today's data with the last version you released, and unreleased commits
# stay unreleased no matter how long they sit there.
#
# The `push:` trigger this workflow used to have is gone — that is what made a
# merge to main a deployment.
on:
  schedule:
    # Every six hours, NOT hourly, and the reason is quota rather than taste.
    # An hourly rebuild is 720 runs a month; four times a day is ~120. The
    # repository is public now, so Actions minutes are unmetered — but a
    # scheduled job that republishes unchanged content is still waste.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# A scheduled run and a manual one can otherwise race and release two builds in
# either order.
#
# `cancel-in-progress: true`, and the false version cost a live regression: a
# scheduled publish sat QUEUED for over eight hours, then finished AFTER a later
# run had already deployed, and released its own build — of the commit it was
# created from. The newer site was overwritten with older content and every
# check was green, because each run did exactly what it was told.
concurrency:
  group: publish-pzsurf-pl
  cancel-in-progress: true

jobs:
  which-release:
    name: Find the released version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      found: ${{ steps.tag.outputs.found }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: tag
        run: |
          set -euo pipefail
          # Newest by VERSION, not by date: a patch cut after a later minor
          # would otherwise win and quietly roll the site back.
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$tag" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release tag exists yet, so there is nothing to refresh. Run the Release workflow to publish the first version."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Refreshing $tag"
          fi

  refresh:
    needs: which-release
    # Skipped rather than falling back to main, deliberately: falling back is
    # precisely the behaviour this workflow was restructured to remove.
    if: needs.which-release.outputs.found == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      ref: ${{ needs.which-release.outputs.tag }}
      version: ${{ needs.which-release.outputs.tag }} (data refresh)
